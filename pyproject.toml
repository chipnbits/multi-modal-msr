[project]
name = "multi-modal-msr"
version = "0.0.1"
description = "Multi-modal magnetic super-resolution (MSR) for aeromagnetic surveys"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.13"
authors = [
    { name = "Simon Ghyselincks", email = "sghyseli@cs.ubc.ca" }
]
classifiers = [
    "Programming Language :: Python :: 3.13",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Physics",
]

dependencies = [
    "numpy>=2.0",
    "scipy>=1.13",
    "matplotlib>=3.8",
    "jupyter>=1.0",
    "ipykernel>=6.0",
    "pandas>=3.0.2",
    "dbfread>=2.0.7",
    "rasterio>=1.5.0",
    "geopandas>=1.1.3",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
    "einops>=0.8.2",
    "wandb>=0.26.0",
    "accelerate>=1.0",
    "torchmetrics>=1.9.0",
    "seaborn>=0.13.2",
]

[build-system]
requires = ["uv_build>=0.9,<0.12"]
build-backend = "uv_build"

# PyTorch extras — pick one: uv sync --extra cpu | uv sync --extra cu128 | uv sync --extra cu130
[project.optional-dependencies]
cpu = [
    "torch>=2.11.0",
    "torchvision>=0.26.0",
]
cu128 = [
    "torch>=2.11.0",
    "torchvision>=0.26.0",
]
cu130 = [
    "torch>=2.11.0",
    "torchvision>=0.26.0",
]

[tool.uv]
# package = true is implicit; src/magsr/ is importable via `import magsr`
conflicts = [
    [
        { extra = "cpu" },
        { extra = "cu128" },
        { extra = "cu130" },
    ],
]

[tool.uv.build-backend]
module-name = "magsr"

[tool.uv.sources]
torch = [
    { index = "pytorch-cpu", extra = "cpu" },
    { index = "pytorch-cu128", extra = "cu128" },
    { index = "pytorch-cu130", extra = "cu130" },
]
torchvision = [
    { index = "pytorch-cpu", extra = "cpu" },
    { index = "pytorch-cu128", extra = "cu128" },
    { index = "pytorch-cu130", extra = "cu130" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true


[dependency-groups]
dev = [
    "pytest>=8.0",
    "black>=25.0",
    "isort>=7.0",
    "pre-commit>=4.5",
    "nbstripout>=0.8",  # Jupyter notebook cleanup
]

[tool.black]
line-length = 108
target-version = ['py313']
include = '\.pyi?$'

[tool.isort]
profile = "black"
line_length = 108
multi_line_output = 3

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = "test_*.py"
pythonpath = ["src"]
