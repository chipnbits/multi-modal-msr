# Snap one product onto its master grid. One config per snapped product — copy this
# file, repoint `inputs.glob` and `output_name`, and pass it with `--config`.
#
# This example is the legacy LR compilation (RTP): 95 per-sheet GeoTIFFs, all in one
# Lambert CC projection at 200 m, resampled up to the 180 m project grid. Because the
# sheets share a CRS, resolution and lattice, they are mosaicked before warping, so
# the resampling kernel reads across sheet seams.
#
# `*_RTP.tif` deliberately excludes `*_RTP_ANSIG.tif` / `*_RTP_FVD.tif`, which are
# separate products with their own configs.
#
# Relative paths resolve against the repo root.
paths:
  master_grid: data/ksa_base_grids/magnetic_base_grid180m.tif
  output_dir: data/processed/ksa_aligned/02_snap_owned/aeromagnetics/180m/cubicspline

processing:
  resample_alg: cubicspline
  apply_mask: true # NaN wherever the master grid is 0 (outside the AOI)
  overlap_strategy: first # first file in sorted order wins where sheets overlap
  output_name: snapped_cubicspline_RTP.tif
  # honor_nodata: false  # default for the mosaic path — the legacy sheets declare
  #                      # nodata=0 but carry meaningful zeros. Set true to mask them.

inputs:
  glob:
    dir: data/raw/ksa_shield/legacy
    pattern: "**/*_RTP.tif"

output_format:
  compress: LZW
  bigtiff: IF_SAFER
  block_size: 512
