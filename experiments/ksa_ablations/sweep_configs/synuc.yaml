# Idealized synthetic-operator study (nb13, k0, p264, fold 3) -> tab:exp_ideal.
# LR is regenerated by a KNOWN upward-continuation operator (dz~U[200,250]m, 3:1 decimation, 1 nT noise),
# removing survey inconsistency. Two operator families:
#   synuc  = flat DEM              -> --synthetic-uc
#   synucd = drape-aware           -> --synthetic-uc --syn-drape
# Scored by evaluate.py on synthetic pairs.
common: "--nb 13 --index-dir data/processed/ksa_aligned/patch_indices_cellgrid8s12_p264_fold3 --domain-rrdbs 0 --num-epochs 20 --val-every 0.1 --synthetic-uc"
runs:
  # flat (terrain-blind) operator
  - {name: rdnpp_x3_ksa_f3_nb13_k0_p264_synuc_mag}
  - {name: rdnpp_x3_ksa_f3_nb13_k0_p264_synuc_1vd,         args: "--lr-aux 1VD"}
  - {name: rdnpp_x3_ksa_f3_nb13_k0_p264_synuc_demgrad,     args: "--use-dem --dem-mode grad"}
  - {name: rdnpp_x3_ksa_f3_nb13_k0_p264_synuc_1vd_demgrad, args: "--lr-aux 1VD --use-dem --dem-mode grad"}
  - {name: rdnpp_x3_ksa_f3_nb13_k0_p264_synuc_demrelief,   args: "--use-dem --dem-mode relief"}
  - {name: rdnpp_x3_ksa_f3_nb13_k0_p264_synuc_relief_1vd,  args: "--lr-aux 1VD --use-dem --dem-mode relief"}
  # drape-aware operator (adds --syn-drape)
  - {name: rdnpp_x3_ksa_f3_nb13_k0_p264_synucd_mag,         args: "--syn-drape"}
  - {name: rdnpp_x3_ksa_f3_nb13_k0_p264_synucd_1vd,         args: "--syn-drape --lr-aux 1VD"}
  - {name: rdnpp_x3_ksa_f3_nb13_k0_p264_synucd_demgrad,     args: "--syn-drape --use-dem --dem-mode grad"}
  - {name: rdnpp_x3_ksa_f3_nb13_k0_p264_synucd_1vd_demgrad, args: "--syn-drape --lr-aux 1VD --use-dem --dem-mode grad"}
  - {name: rdnpp_x3_ksa_f3_nb13_k0_p264_synucd_demrelief,   args: "--syn-drape --use-dem --dem-mode relief"}
  - {name: rdnpp_x3_ksa_f3_nb13_k0_p264_synucd_relief_1vd,  args: "--syn-drape --lr-aux 1VD --use-dem --dem-mode relief"}
